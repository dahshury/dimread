name: Release

# Tag-triggered (push a `v*` tag) or manual (workflow_dispatch). Builds the
# Windows NSIS installer + portable zip, the Linux AppImage/deb/rpm set, and
# macOS dmg/app archives for both architectures, then attaches everything to
# a GitHub release.
#
# No signing key is required: every build step passes the
# tools/tauri-ci-artifacts.conf.json overlay, which disables Tauri updater
# artifacts. To ship updater artifacts instead:
#   1. `bun run tauri signer generate` and keep the private key safe.
#   2. Set `bundle.createUpdaterArtifacts: true` and configure
#      `plugins.updater.pubkey` + `endpoints` in src-tauri/tauri.conf.json.
#   3. Add TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD as
#      repo secrets and uncomment the env blocks marked "updater signing".

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Leave the GitHub release as a draft after all assets upload"
        required: true
        type: boolean
        default: true
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      draft: ${{ steps.gate.outputs.draft }}
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The version must be identical across tauri.conf.json, package.json,
      # and Cargo.toml, and (for tag pushes) match the pushed tag.
      - name: Validate version
        id: version
        run: |
          set -euo pipefail

          version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          package_version="$(jq -r '.version' package.json)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"

          if [ "$version" != "$package_version" ] || [ "$version" != "$cargo_version" ]; then
            echo "::error::Version mismatch: tauri=$version package=$package_version cargo=$cargo_version"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version v$version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Decide release mode
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_DRAFT_INPUT: ${{ inputs.draft || false }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          draft="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            draft="$RELEASE_DRAFT_INPUT"
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows artifacts
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          key: release-windows-x64

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Install renderer dependencies
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) {
            bun pm cache rm
            bun install --frozen-lockfile
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # updater signing (optional) — see the header comment:
      # env:
      #   TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build Windows NSIS bundle
        shell: pwsh
        run: tools\windows\tauri-build.ps1 -Bundles nsis -Config tools\tauri-ci-artifacts.conf.json

      - name: Collect portable Windows artifacts
        shell: pwsh
        run: tools\windows\tauri-portable.ps1 -SkipBuild

      - name: Upload Windows artifacts to workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dimread-windows-x64
          if-no-files-found: error
          path: |
            dist/DimRead.exe
            dist/DimRead-portable.zip

  linux:
    name: Build Linux artifacts
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cpio \
            curl \
            file \
            fuse \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            rpm \
            wget \
            xdg-utils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          key: release-linux-x64

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Install renderer dependencies
        run: |
          bun install --frozen-lockfile || {
            bun pm cache rm
            bun install --frozen-lockfile
          }

      # updater signing (optional) — see the header comment:
      # env:
      #   TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build Linux artifacts
        run: bash tools/linux/tauri-bundles.sh

      - name: Upload Linux artifacts to workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dimread-linux-x64
          if-no-files-found: error
          path: dist/linux/*

  macos:
    name: Build macOS artifacts (${{ matrix.arch }})
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          key: release-macos-${{ matrix.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Install renderer dependencies
        run: |
          bun install --frozen-lockfile || {
            bun pm cache rm
            bun install --frozen-lockfile
          }

      # updater signing (optional) — see the header comment:
      # env:
      #   TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build macOS artifacts
        run: bash tools/macos/tauri-bundles.sh "${{ matrix.target }}" "${{ matrix.arch }}"

      - name: Upload macOS artifacts to workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dimread-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/macos/${{ matrix.arch }}/*

  publish:
    name: Publish GitHub release
    needs: [metadata, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DRAFT: ${{ needs.metadata.outputs.draft }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          args=(--title "$TAG" --generate-notes)
          if [ "$RELEASE_DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          # Pre-release for any version with a pre-release segment (e.g. -alpha.1).
          case "$VERSION" in
            *-*) args+=(--prerelease) ;;
          esac
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            args+=(--target "$GITHUB_SHA")
          fi

          mapfile -t assets < <(find release-assets -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading assets (clobber)."
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" "${args[@]}" --repo "$GITHUB_REPOSITORY"
          fi
