name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "messages/**"
      - "public/**"
      - "windows/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "knip.json"
      - "tools/i18n/**"
      - "vite.config.ts"
      - "biome.jsonc"
      - "tsconfig*"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "messages/**"
      - "public/**"
      - "windows/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "knip.json"
      - "tools/i18n/**"
      - "vite.config.ts"
      - "biome.jsonc"
      - "tsconfig*"
      - ".github/workflows/ci.yml"

# Cancel superseded runs on the same ref — a fresh push obsoletes the
# prior pipeline immediately.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      # Bun's install cache. Keyed on bun.lock so a dep bump invalidates
      # cleanly; the restore-keys prefix reuses cache layers across lockfile
      # changes within the same OS image.
      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Biome (lint + format, via Ultracite) plus the standalone
      # `no-literal-string` scanner that keeps JSX text going through i18n.
      - name: Lint + format (Biome + i18n literal guard)
        run: bun run lint

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Dead-code check
        run: bun run check:deadcode

      - name: i18n parity check
        run: bun run check:i18n

      # Renderer bundle smoke: all four window entries must emit.
      - name: Build renderer
        run: bun run build
