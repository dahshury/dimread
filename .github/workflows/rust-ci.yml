name: Rust CI

# Backend gate for the src-tauri crate: fmt + clippy + tests on Windows,
# a macOS/Linux cross-platform matrix (checks + `tauri build --no-bundle`),
# and a Linux bundle gate that builds the shipped AppImage/deb/rpm layouts.
#
# Path-gated on src-tauri/** + the packaging scripts so renderer-only PRs
# don't pay the (slow, link-dominated) cargo build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "tools/windows/**"
      - "tools/linux/**"
      - "tools/macos/**"
      - "tools/tauri-ci-artifacts.conf.json"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - ".github/workflows/rust-ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "tools/windows/**"
      - "tools/linux/**"
      - "tools/macos/**"
      - "tools/tauri-ci-artifacts.conf.json"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - ".github/workflows/rust-ci.yml"
      - ".github/workflows/release.yml"

# Cancel superseded runs on the same ref — a fresh push obsoletes the
# prior pipeline immediately.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # windows-latest mirrors the primary shipped target.
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      # Cache the src-tauri target dir keyed on the crate. The crate's link
      # step dominates rebuild time, so a warm target is a large speedup.
      - name: Cache cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"

      # The tauri context macro requires build.frontendDist (../dist) to exist
      # even for cargo check/test; dist/ is gitignored, so create a stub.
      - name: Create placeholder frontendDist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Set-Content -Path dist\index.html -Value "<!doctype html><title>ci stub</title>"

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      # The export_bindings test regenerates src/bindings.ts from the live
      # command/event registry; a dirty diff means the checked-in bindings
      # are stale.
      - name: Assert generated bindings are up to date
        run: git diff --exit-code src/bindings.ts

  cross-platform:
    name: Cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            wget

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Install renderer dependencies
        run: |
          bun install --frozen-lockfile || {
            bun pm cache rm
            bun install --frozen-lockfile
          }

      # Real renderer build: gives cargo a real frontendDist and smoke-tests
      # the four window entries on this OS.
      - name: Build renderer
        run: bun run build

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Tauri build (no bundle)
        run: bun run tauri build --no-bundle

  # Build and inspect the exact shipped Linux layouts. Package completeness
  # is a release invariant, so this job is intentionally a hard gate.
  linux-artifacts:
    name: Linux artifacts (AppImage / deb / rpm package gate)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cpio \
            curl \
            file \
            fuse \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            rpm \
            wget \
            xdg-utils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          key: ci-linux-artifacts

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Install renderer dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux artifacts
        run: bash tools/linux/tauri-bundles.sh

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dimread-linux-x64
          if-no-files-found: error
          path: dist/linux/*
