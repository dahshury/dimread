# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Runs the pinned devDependency through bun (same toolchain as ci.yml) so CI
# scans with the exact version developers run locally. `--no-supply-chain`
# skips the Socket.dev network scan (no network flakiness in CI);
# `--blocking error` fails the job only on error-severity findings.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor

name: React Doctor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "bun.lock"
      - "doctor.config.json"
      - "tsconfig*"
      - ".github/workflows/react-doctor.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "bun.lock"
      - "doctor.config.json"
      - "tsconfig*"
      - ".github/workflows/react-doctor.yml"

# Cancels any in-flight scan for the same PR (or branch, on push) the moment
# a new commit arrives.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  react-doctor:
    name: React Doctor (full scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: React Doctor scan
        run: bun run check:react
