[package]
name = "dimread"
version = "0.0.4-alpha"
description = "DimRead — Tauri v2 + React 19 desktop app"
authors = ["dahshury"]
edition = "2024"
license = "MIT"
default-run = "dimread"
autobins = false

[[bin]]
name = "dimread"
path = "src/main.rs"

[workspace]
resolver = "3"

[profile.dev]
incremental = true
# Smaller debug info dramatically cuts MSVC link time. "line-tables-only" keeps
# panic/backtrace line numbers but drops the heavy variable/type info you only
# need under a step debugger.
debug = "line-tables-only"

[lib]
# The `_lib` suffix is necessary to make the lib name unique so it doesn't
# conflict with the bin name on Windows (rust-lang/cargo#8519).
name = "dimread_lib"
# Desktop-only: the app bin consumes an rlib. Tauri's template also lists
# staticlib/cdylib for mobile FFI, but emitting those unused artifacts makes
# every dev edit relink the entire native dependency graph.
crate-type = ["rlib"]

[features]
default = []
# Keep WebView devtools out of default/release builds; enable with
# `cargo tauri dev --features devtools` when inspection is needed.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
once_cell = "1"
tauri = { version = "2.11.2", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  "image-png",
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.95"
thiserror = "2"
log = "0.4.25"
tokio = "1.43.0"
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
chrono = "0.4"
chrono-tz = "0.10"
reqwest = { version = "0.13.2", default-features = false, features = ["stream", "rustls"] }
futures-util = "0.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Ordering release tags in the About tab's update check. Tauri already pulls
# this in for `package_info().version`; listing it makes the dependency explicit.
semver = "1"
specta = { version = "=2.0.0-rc.22", features = ["serde_json"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
iana-time-zone = "0.1.65"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"
tauri-plugin-updater = "2.10.0"

[target.'cfg(windows)'.dependencies]
# Taskbar light/dark theme detection for the theme-aware tray icon.
winreg = "0.55"
# Win32 display control: monitor enumeration + gamma ramps (GDI) and full-screen
# grayscale (Magnification). Only the features the display engine needs.
# `Win32_System_Threading` backs the per-app rules watcher's process-name lookup
# (`OpenProcess` + `QueryFullProcessImageNameW`).
#
# The `Graphics_Capture` / Direct3D11 / DirectComposition / Dxgi / Fxc features
# back MagicX's HDR per-window effect backend (`magicx::engine_wgc`): the
# Magnification API refuses `MagSetColorEffect` with ERROR_NOT_SUPPORTED while a
# display is in advanced-colour mode, so those targets are captured with
# Windows.Graphics.Capture and re-composited through a shader instead.
windows = { version = "0.61", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_ColorSystem",
  "Win32_UI_HiDpi",
  "Win32_UI_Magnification",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Dynamically load Xlib + XRandR for per-output monitor discovery and gamma
# ramps. Dynamic loading keeps the binary usable on Wayland-only systems where
# these libraries may be absent.
x11-dl = "2.21"
# Native wlroots compositors expose per-output gamma control through this
# Wayland protocol. The controls stay alive for as long as our actor owns its
# connection; destroying one restores the compositor's captured original LUT.
wayland-client = "0.31.14"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# `poll` integrates the Wayland socket with the actor's command wakeup without
# a timer, and `memfd_create` supplies the protocol's anonymous LUT buffer.
rustix = { version = "1.1", features = ["event", "fs"] }

[dev-dependencies]
specta-typescript = "0.0.9"
tempfile = "3"

# Lint policy: plain `cargo check` and `cargo clippy` should be warning-clean
# without depending on CI-only flags. Pedantic/nursery are intentionally not
# enabled: they would turn broad API and style preferences into hard errors.
[lints.rust]
warnings = "deny"
future-incompatible = "deny"
nonstandard-style = "deny"
rust-2018-idioms = "deny"
unused = "deny"
unsafe-op-in-unsafe-fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
clone_on_copy = "deny"
large_enum_variant = "deny"
manual_ok_or = "deny"
map_unwrap_or = "deny"
needless_collect = "deny"
redundant_clone = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
